<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות שוטפות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-2xl mx-auto p-4 sm:p-6">
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h1 class="text-2xl font-bold text-gray-900">ניהול משימות משותף</h1>
        </header>

        <!-- טופס הוספת משימה -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4">הוספת משימה חדשה</h2>
            <form id="task-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">תוכן המשימה</label>
                    <input type="text" id="task-title" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: עדכון דוח התקדמות שבועי...">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">אחראי</label>
                        <select id="task-assignee" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="כפיר">כפיר</option>
                            <option value="מילר">מילר</option>
                            <option value="שנינו">שנינו</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">עדיפות</label>
                        <select id="task-priority" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="רגיל">רגיל</option>
                            <option value="דחוף">דחוף 🚨</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors shadow-sm">
                    הוסף משימה
                </button>
            </form>
        </div>

        <!-- רשימת משימות לביצוע -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-blue-900">📌 משימות לביצוע</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 font-medium">סינון:</label>
                    <select id="filter-active" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                        <option value="שנינו">שנינו</option>
                    </select>
                </div>
            </div>
            <div id="active-tasks-list" class="space-y-3">
                <div class="text-center py-4 text-gray-400">טוען משימות...</div>
            </div>
        </div>

        <!-- רשימת משימות שבוצעו -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-gray-500">✅ משימות שבוצעו</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 font-medium">סינון:</label>
                    <select id="filter-completed" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                        <option value="שנינו">שנינו</option>
                    </select>
                </div>
            </div>
            <div id="completed-tasks-list" class="space-y-3">
                <div class="text-center py-4 text-gray-400">אין משימות שבוצעו עדיין</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs וניהול הנתונים -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzoMQP--v9Y5YodB1fFMqgVEFdNvETebs",
            authDomain: "missions-4b9fb.firebaseapp.com",
            projectId: "missions-4b9fb",
            storageBucket: "missions-4b9fb.firebasestorage.app",
            messagingSenderId: "972042110515",
            appId: "1:972042110515:web:99da62d813112b3693c546",
            measurementId: "G-7X36FDXMQ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        let allTasks = [];

        // הוספת משימה
        document.getElementById('task-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const assignee = document.getElementById('task-assignee').value;
            const priority = document.getElementById('task-priority').value;

            try {
                await addDoc(tasksCollection, {
                    title: title,
                    assignee: assignee,
                    priority: priority,
                    completed: false,
                    createdAt: new Date()
                });
                document.getElementById('task-title').value = '';
            } catch (error) {
                console.error("שגיאה בהוספת משימה: ", error);
                alert("אירעה שגיאה בשמירת המשימה.");
            }
        });

        // האזנה לשינויים בזמן אמת מהענן
        const q = query(tasksCollection);
        onSnapshot(q, (snapshot) => {
            allTasks = [];
            snapshot.forEach((docSnapshot) => {
                allTasks.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            renderTasks();
        });

        // האזנה לשינויים בתיבות הסינון
        document.getElementById('filter-active').addEventListener('change', renderTasks);
        document.getElementById('filter-completed').addEventListener('change', renderTasks);

        function renderTasks() {
            const activeList = document.getElementById('active-tasks-list');
            const completedList = document.getElementById('completed-tasks-list');
            
            const activeFilter = document.getElementById('filter-active').value;
            const completedFilter = document.getElementById('filter-completed').value;

            activeList.innerHTML = '';
            completedList.innerHTML = '';

            let hasActive = false;
            let hasCompleted = false;

            const siteUrl = window.location.href;

            allTasks.forEach(task => {
                // סינון לפי אחראי
                const matchesActiveFilter = (activeFilter === 'הכל' || task.assignee === activeFilter);
                const matchesCompletedFilter = (completedFilter === 'הכל' || task.assignee === completedFilter);

                if (task.completed && !matchesCompletedFilter) return;
                if (!task.completed && !matchesActiveFilter) return;

                const taskCard = document.createElement('div');
                taskCard.className = `flex items-center justify-between p-4 border rounded-xl transition-all ${task.completed ? 'bg-gray-50 border-gray-200 opacity-70' : 'bg-white border-gray-200 shadow-sm'}`;
                
                // יצירת הודעת וואצאפ למספר המבוקש עם קישור לאתר
                const whatsappText = encodeURIComponent(`מקפיץ לך את המשימה ${task.title}\nקישור לאתר: ${siteUrl}`);
                const whatsappUrl = `https://wa.me/972504244336?text=${whatsappText}`;

                taskCard.innerHTML = `
                    <div class="flex items-center gap-3 flex-grow">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}', ${!task.completed})" class="w-5 h-5 text-blue-600 rounded cursor-pointer">
                        <div class="flex-grow">
                            <p class="font-medium ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</p>
                            <span class="text-xs text-gray-500">אחראי: ${task.assignee} | עדיפות: ${task.priority}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 sm:gap-2">
                        <a href="${whatsappUrl}" target="_blank" class="text-green-600 hover:text-green-700 bg-green-50 hover:bg-green-100 p-2 rounded-lg text-xs font-medium transition-colors flex items-center gap-1" title="שלח וואצאפ">
                            📱 <span class="hidden sm:inline">וואצאפ</span>
                        </a>
                        <button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 text-sm font-medium px-2 py-1">מחק</button>
                    </div>
                `;

                if (task.completed) {
                    hasCompleted = true;
                    completedList.appendChild(taskCard);
                } else {
                    hasActive = true;
                    activeList.appendChild(taskCard);
                }
            });

            if (!hasActive) {
                activeList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות תואמות להצגה</div>';
            }
            if (!hasCompleted) {
                completedList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות תואמות להצגה</div>';
            }
        }

        // פונקציות גלובליות למחיקה ועדכון סטטוס
        window.toggleTask = async function(id, completed) {
            const taskRef = doc(db, "tasks", id);
            await updateDoc(taskRef, { completed: completed });
        }

        window.deleteTask = async function(id) {
            if (confirm("האם למחוק את המשימה לצמיתות?")) {
                const taskRef = doc(db, "tasks", id);
                await deleteDoc(taskRef);
            }
        }
    </script>
</body>
</html>
