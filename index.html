<!DOCTYPE html>
<html lang="he" dir="rtl" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות שוטפות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .dragging { opacity: 0.4; }
        .drag-over { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
        .dark .drag-over { border-color: #60a5fa !important; background-color: #1e3a8a !important; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen text-gray-800 dark:text-gray-100 transition-colors">
    <div class="max-w-2xl mx-auto p-4 sm:p-6 pb-24">
        <header class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mb-6 border border-gray-100 dark:border-gray-700 flex justify-between items-center transition-colors">
            <h1 class="text-2xl font-bold text-gray-900 dark:text-white mx-auto">ניהול משימות משותף</h1>
            <button onclick="toggleDarkMode()" class="p-2 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors text-sm" title="החלף מצב תצוגה">
                🌓
            </button>
        </header>

        <!-- רשימת משימות לביצוע -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 mb-6 border border-gray-100 dark:border-gray-700 transition-colors">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-blue-900 dark:text-blue-400">📌 משימות לביצוע</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">סינון:</label>
                    <select id="filter-active" class="px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                    </select>
                </div>
            </div>

            <!-- שורת הוספה מהירה -->
            <form id="task-form" class="mb-4 p-3 bg-blue-50/50 dark:bg-gray-700/50 border border-blue-100 dark:border-gray-600 rounded-xl flex flex-col sm:flex-row gap-2">
                <input type="text" id="task-title" required class="flex-grow px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white" placeholder="הוסף משימה חדשה...">
                <select id="task-assignee" class="px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white">
                    <option value="כפיר">כפיר</option>
                    <option value="מילר">מילר</option>
                    <option value="שנינו">שנינו</option>
                </select>
                <select id="task-priority" class="px-3 py-2 bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white">
                    <option value="רגיל">רגיל</option>
                    <option value="דחוף">דחוף 🚨</option>
                </select>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors shadow-sm whitespace-nowrap">
                    + הוסף
                </button>
            </form>

            <div id="active-tasks-list" class="space-y-3 min-h-[50px]">
                <div class="text-center py-4 text-gray-400">טוען משימות...</div>
            </div>
        </div>

        <!-- רשימת משימות שבוצעו -->
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm p-6 border border-gray-100 dark:border-gray-700 transition-colors">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-gray-500 dark:text-gray-400">✅ משימות שבוצעו</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 dark:text-gray-400 font-medium">סינון:</label>
                    <select id="filter-completed" class="px-3 py-1.5 border border-gray-300 dark:border-gray-600 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50 dark:bg-gray-700 text-gray-800 dark:text-gray-100">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                    </select>
                </div>
            </div>
            <div id="completed-tasks-list" class="space-y-3 min-h-[50px]">
                <div class="text-center py-4 text-gray-400">אין משימות שבוצעו עדיין</div>
            </div>
        </div>
    </div>

    <!-- כפתור בוט צף ואוואטר בתחתית המסך -->
    <div class="fixed bottom-6 left-6 z-50">
        <!-- חלון הצ'אט -->
        <div id="chat-window" class="hidden absolute bottom-16 left-0 w-80 sm:w-96 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 flex flex-col overflow-hidden transition-all">
            <div class="bg-blue-600 text-white p-4 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                    <span class="font-bold text-sm">הבוט החכם של Gemini 🤖</span>
                </div>
                <button onclick="toggleChat()" class="text-white hover:text-gray-200 text-lg font-bold">&times;</button>
            </div>
            <div id="chat-messages" class="p-3 h-72 overflow-y-auto space-y-3 text-sm bg-gray-50 dark:bg-gray-900/50">
                <div class="bg-blue-100 dark:bg-blue-900/50 text-blue-900 dark:text-blue-200 p-3 rounded-xl rounded-br-none text-xs leading-relaxed">
                    היי כפיר! אני מחובר ל-AI ויודע להבין שפה חופשית. דבר איתי חופשי:<br>
                    • "מילר דיבר עם יהל אז תסמן שבוצע, ותוסיף שצריך לדבר עם מאור"<br>
                    • "תוסיף משימה דחופה לקנות קפה שזה עלי"
                </div>
            </div>
            <div class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex gap-2">
                <input type="text" id="chat-input" placeholder="כתוב חופשי מה שתרצה..." class="flex-grow px-3 py-2 text-sm bg-gray-100 dark:bg-gray-700 border-0 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white" onkeypress="if(event.key==='Enter') sendChatCommand()">
                <button onclick="sendChatCommand()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition-colors">שלח</button>
            </div>
        </div>

        <!-- כפתור האוואטר הצף -->
        <button onclick="toggleChat()" class="w-14 h-14 bg-blue-600 hover:bg-blue-700 text-white rounded-full shadow-lg flex items-center justify-center text-2xl transition-transform hover:scale-105 focus:outline-none ring-4 ring-blue-400/30">
            🤖
        </button>
    </div>

    <!-- פופאפ עריכת משימה -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl max-w-md w-full p-6 border border-gray-100 dark:border-gray-700 transition-colors">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-4">עריכת משימה</h3>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-task-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">תוכן המשימה</label>
                    <input type="text" id="edit-task-title" required class="w-full px-4 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">אחראי</label>
                        <select id="edit-task-assignee" class="w-full px-4 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white">
                            <option value="כפיר">כפיר</option>
                            <option value="מילר">מילר</option>
                            <option value="שנינו">שנינו</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">עדיפות</label>
                        <select id="edit-task-priority" class="w-full px-4 py-2 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none dark:text-white">
                            <option value="רגיל">רגיל</option>
                            <option value="דחוף">דחוף 🚨</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors shadow-sm">שמור שינויים</button>
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-medium py-2.5 px-4 rounded-xl transition-colors">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs ולוגיקת הבוט מבוסס ה-AI -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { GoogleGenerativeAI } from "https://esm.run/@google/genai";

        const firebaseConfig = {
            apiKey: "AIzaSyCzoMQP--v9Y5YodB1fFMqgVEFdNvETebs",
            authDomain: "missions-4b9fb.firebaseapp.com",
            projectId: "missions-4b9fb",
            storageBucket: "missions-4b9fb.firebasestorage.app",
            messagingSenderId: "972042110515",
            appId: "1:972042110515:web:99da62d813112b3693c546",
            measurementId: "G-7X36FDXMQ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        let allTasks = [];

        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }

        window.toggleDarkMode = function() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        window.toggleChat = function() {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.classList.toggle('hidden');
            if(!chatWindow.classList.contains('hidden')) {
                document.getElementById('chat-input').focus();
            }
        }

        document.getElementById('task-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const assignee = document.getElementById('task-assignee').value;
            const priority = document.getElementById('task-priority').value;
            await addNewTask(title, assignee, priority);
            document.getElementById('task-title').value = '';
        });

        async function addNewTask(title, assignee = "שנינו", priority = "רגיל") {
            const minOrder = allTasks.reduce((min, t) => (t.order !== undefined && t.order < min ? t.order : min), 0);
            await addDoc(tasksCollection, {
                title, assignee, priority,
                completed: false,
                order: minOrder - 1,
                createdAt: new Date()
            });
        }

        // חיבור אמיתי וחכם ל-Gemini שמתרגם את הבקשה שלך לפעולות במערכת
        window.sendChatCommand = async function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            input.value = '';

            const typingId = appendMessage("חושב...", 'bot');

            try {
                // יצירת רשימת המשימות הפתוחות הנוכחיות כדי שה-AI ידע מה קיים
                const activeTasksSummary = allTasks.filter(t => !t.completed).map(t => `- ID: ${t.id}, כותרת: "${t.title}", אחראי: ${t.assignee}`).join('\n');

                const apiKey = "AIzaSyCzoMQP--v9Y5YodB1fFMqgVEFdNvETebs"; // מפתח ה-API שלך
                const ai = new GoogleGenerativeAI({ apiKey });

                const prompt = `אתה עוזר ניהול משימות חכם המחובר למערכת של כפיר ומילר.
רשימת המשימות הפתוחות כרגע:
${activeTasksSummary}

המשתמש כתב לך את ההודעה הבאה: "${text}"

נתח את ההודעה ובצע פעולות נדרשות. עליך להחזיר JSON תקין בלבד (ללא טקסט נוסף סביבו) במבנה הבא:
{
  "actions": [
    { "type": "add", "title": "...", "assignee": "כפיר/מילר/שנינו", "priority": "רגיל/דחוף" },
    { "type": "complete", "id": "...", "titleMatch": "..." },
    { "type": "delete", "id": "..." }
  ],
  "reply": "הודעה קצרה וכיפית בעברית למשתמש על מה שבוצע"
}
אם צריך לסמן משימה כבוצעה, מצא את ה-ID המתאים ביותר מתוך הרשימה למעלה לפי תוכן ההודעה. אפשר לבצע כמה פעולות במקביל (למשל גם להוסיף וגם לסמן).`;

                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt
                });

                let rawResponse = response.text.trim();
                // ניקוי מעטפות Markdown אם ישנן
                rawResponse = rawResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                const result = JSON.parse(rawResponse);

                // ביצוע הפעולות בפועל מול ה-Firebase
                for (const action of result.actions) {
                    if (action.type === 'add') {
                        await addNewTask(action.title, action.assignee || 'שנינו', action.priority || 'רגיל');
                    } else if (action.type === 'complete' && action.id) {
                        await updateDoc(doc(db, "tasks", action.id), { completed: true });
                    } else if (action.type === 'delete' && action.id) {
                        await deleteDoc(doc(db, "tasks", action.id));
                    }
                }

                document.getElementById(typingId).remove();
                appendMessage(result.reply || "בוצע בהצלחה! 👍", 'bot');

            } catch (error) {
                console.error("שגיאה בניתוח ה-AI:", error);
                document.getElementById(typingId).remove();
                appendMessage("תקלה קטנה בהבנת הפקודה. ננסה שוב?", 'bot');
            }
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-messages');
            const div = document.createElement('div');
            const msgId = 'msg-' + Date.now() + Math.random();
            div.id = msgId;
            if (sender === 'user') {
                div.className = "bg-blue-600 text-white p-3 rounded-xl rounded-bl-none text-xs ml-auto max-w-[85%] leading-relaxed";
            } else {
                div.className = "bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 p-3 rounded-xl rounded-br-none text-xs mr-auto max-w-[85%] leading-relaxed";
            }
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return msgId;
        }

        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-task-id').value;
            const title = document.getElementById('edit-task-title').value;
            const assignee = document.getElementById('edit-task-assignee').value;
            const priority = document.getElementById('edit-task-priority').value;
            await updateDoc(doc(db, "tasks", id), { title, assignee, priority });
            closeEditModal();
        });

        onSnapshot(query(tasksCollection), (snapshot) => {
            allTasks = [];
            snapshot.forEach((docSnapshot) => {
                allTasks.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            allTasks.sort((a, b) => (a.order || 0) - (b.order || 0));
            renderTasks();
        });

        document.getElementById('filter-active').addEventListener('change', renderTasks);
        document.getElementById('filter-completed').addEventListener('change', renderTasks);

        function renderTasks() {
            const activeList = document.getElementById('active-tasks-list');
            const completedList = document.getElementById('completed-tasks-list');
            
            const activeFilter = document.getElementById('filter-active').value;
            const completedFilter = document.getElementById('filter-completed').value;

            activeList.innerHTML = '';
            completedList.innerHTML = '';

            let hasActive = false;
            let hasCompleted = false;
            const siteUrl = window.location.href;

            allTasks.forEach(task => {
                const matchesFilter = (filterVal, taskAssignee) => {
                    if (filterVal === 'הכל') return true;
                    if (taskAssignee === 'שנינו') return true;
                    return taskAssignee === filterVal;
                };

                if (task.completed && !matchesFilter(completedFilter, task.assignee)) return;
                if (!task.completed && !matchesFilter(activeFilter, task.assignee)) return;

                const taskCard = document.createElement('div');
                taskCard.className = `flex items-center justify-between p-4 border rounded-xl transition-all cursor-grab active:cursor-grabbing ${task.completed ? 'bg-gray-50 dark:bg-gray-700/50 border-gray-200 dark:border-gray-700 opacity-70' : 'bg-white dark:bg-gray-700 border-gray-200 dark:border-gray-600 shadow-sm'}`;
                taskCard.setAttribute('draggable', 'true');
                taskCard.dataset.id = task.id;
                
                const whatsappText = encodeURIComponent(`מקפיץ לך את המשימה ${task.title}\nקישור לאתר: ${siteUrl}`);
                const whatsappUrl = `https://wa.me/972504244336?text=${whatsappText}`;
                const whatsappIconSvg = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>`;

                taskCard.innerHTML = `
                    <div class="flex items-center gap-3 flex-grow">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}', ${!task.completed})" class="w-5 h-5 text-blue-600 rounded cursor-pointer">
                        <div class="flex-grow">
                            <p class="font-medium ${task.completed ? 'line-through text-gray-400 dark:text-gray-500' : 'text-gray-800 dark:text-gray-100'}">${task.title}</p>
                            <span class="text-xs text-gray-500 dark:text-gray-400">אחראי: ${task.assignee} | עדיפות: ${task.priority}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 sm:gap-2">
                        <a href="${whatsappUrl}" target="_blank" class="text-green-600 dark:text-green-400 hover:text-green-700 bg-green-50 dark:bg-green-900/40 hover:bg-green-100 p-2 rounded-lg text-xs font-medium transition-colors flex items-center justify-center" title="שלח וואצאפ">
                            ${whatsappIconSvg}
                        </a>
                        <button onclick="openEditModal('${task.id}', '${escapeHtml(task.title)}', '${task.assignee}', '${task.priority}')" class="text-blue-500 dark:text-blue-400 hover:text-blue-700 text-sm font-medium px-2 py-1">ערוך</button>
                        <button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 text-sm font-medium px-2 py-1">מחק</button>
                    </div>
                `;

                addDragAndDropEvents(taskCard);

                if (task.completed) {
                    hasCompleted = true;
                    completedList.appendChild(taskCard);
                } else {
                    hasActive = true;
                    activeList.appendChild(taskCard);
                }
            });

            if (!hasActive) activeList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות תואמות להצגה</div>';
            if (!hasCompleted) completedList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות שבוצעו עדיין</div>';
        }

        function addDragAndDropEvents(element) {
            element.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', element.dataset.id);
                element.classList.add('dragging');
            });
            element.addEventListener('dragend', () => {
                element.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });
            element.addEventListener('dragover', (e) => {
                e.preventDefault();
                const draggingElement = document.querySelector('.dragging');
                if (!draggingElement) return;
                const parentList = element.parentNode;
                if (parentList === draggingElement.parentNode) {
                    element.classList.add('drag-over');
                    const bounding = element.getBoundingClientRect();
                    if (e.clientY - bounding.top > bounding.height / 2) {
                        parentList.insertBefore(draggingElement, element.nextSibling);
                    } else {
                        parentList.insertBefore(draggingElement, element);
                    }
                }
            });
            element.addEventListener('dragleave', () => element.classList.remove('drag-over'));
            element.addEventListener('drop', async (e) => {
                e.preventDefault();
                element.classList.remove('drag-over');
                const parentList = element.parentNode;
                const batch = writeBatch(db);
                parentList.querySelectorAll('[data-id]').forEach((card, index) => {
                    batch.update(doc(db, "tasks", card.dataset.id), { order: index });
                });
                await batch.commit();
            });
        }

        function escapeHtml(str) { return str.replace(/'/g, "&#39;").replace(/"/g, "&quot;"); }

        window.openEditModal = function(id, title, assignee, priority) {
            document.getElementById('edit-task-id').value = id;
            document.getElementById('edit-task-title').value = title;
            document.getElementById('edit-task-assignee').value = assignee;
            document.getElementById('edit-task-priority').value = priority;
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        window.closeEditModal = function() { document.getElementById('edit-modal').classList.add('hidden'); }
        window.toggleTask = async function(id, completed) { await updateDoc(doc(db, "tasks", id), { completed }); }
        window.deleteTask = async function(id) {
            if (confirm("האם למחוק את המשימה לצמיתות?")) {
                await deleteDoc(doc(db, "tasks", id));
            }
        }
    </script>
</body>
</html>
