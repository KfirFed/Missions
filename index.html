<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול משימות שוטפות</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .dragging { opacity: 0.4; }
        .drag-over { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <div class="max-w-2xl mx-auto p-4 sm:p-6">
        <header class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100 text-center">
            <h1 class="text-2xl font-bold text-gray-900">ניהול משימות משותף</h1>
        </header>

        <!-- טופס הוספת משימה -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4">הוספת משימה חדשה</h2>
            <form id="task-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">תוכן המשימה</label>
                    <input type="text" id="task-title" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: עדכון דוח התקדמות שבועי...">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">אחראי</label>
                        <select id="task-assignee" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="כפיר">כפיר</option>
                            <option value="מילר">מילר</option>
                            <option value="שנינו">שנינו</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">עדיפות</label>
                        <select id="task-priority" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="רגיל">רגיל</option>
                            <option value="דחוף">דחוף 🚨</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors shadow-sm">
                    הוסף משימה
                </button>
            </form>
        </div>

        <!-- רשימת משימות לביצוע -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-blue-900">📌 משימות לביצוע <span class="text-xs text-gray-400 font-normal">(ניתן לגרור ולשדר סדר)</span></h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 font-medium">סינון:</label>
                    <select id="filter-active" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                    </select>
                </div>
            </div>
            <div id="active-tasks-list" class="space-y-3 min-h-[50px]">
                <div class="text-center py-4 text-gray-400">טוען משימות...</div>
            </div>
        </div>

        <!-- רשימת משימות שבוצעו -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
                <h2 class="text-lg font-semibold text-gray-500">✅ משימות שבוצעו</h2>
                <div class="flex items-center gap-2">
                    <label class="text-xs text-gray-500 font-medium">סינון:</label>
                    <select id="filter-completed" class="px-3 py-1.5 border border-gray-300 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none bg-gray-50">
                        <option value="הכל">הכל</option>
                        <option value="כפיר">כפיר</option>
                        <option value="מילר">מילר</option>
                    </select>
                </div>
            </div>
            <div id="completed-tasks-list" class="space-y-3 min-h-[50px]">
                <div class="text-center py-4 text-gray-400">אין משימות שבוצעו עדיין</div>
            </div>
        </div>
    </div>

    <!-- פופאפ (Modal) עריכת משימה -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 border border-gray-100">
            <h3 class="text-xl font-bold text-gray-900 mb-4">עריכת משימה</h3>
            <form id="edit-form" class="space-y-4">
                <input type="hidden" id="edit-task-id">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">תוכן המשימה</label>
                    <input type="text" id="edit-task-title" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">אחראי</label>
                        <select id="edit-task-assignee" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="כפיר">כפיר</option>
                            <option value="מילר">מילר</option>
                            <option value="שנינו">שנינו</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">עדיפות</label>
                        <select id="edit-task-priority" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="רגיל">רגיל</option>
                            <option value="דחוף">דחוף 🚨</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-xl transition-colors shadow-sm">
                        שמור שינויים
                    </button>
                    <button type="button" onclick="closeEditModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2.5 px-4 rounded-xl transition-colors">
                        ביטול
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs וניהול הנתונים -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, writeBatch } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCzoMQP--v9Y5YodB1fFMqgVEFdNvETebs",
            authDomain: "missions-4b9fb.firebaseapp.com",
            projectId: "missions-4b9fb",
            storageBucket: "missions-4b9fb.firebasestorage.app",
            messagingSenderId: "972042110515",
            appId: "1:972042110515:web:99da62d813112b3693c546",
            measurementId: "G-7X36FDXMQ9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const tasksCollection = collection(db, "tasks");

        let allTasks = [];

        // הוספת משימה
        document.getElementById('task-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const assignee = document.getElementById('task-assignee').value;
            const priority = document.getElementById('task-priority').value;

            try {
                // חישוב סדר (order) חדש בסוף הרשימה
                const maxOrder = allTasks.reduce((max, t) => (t.order !== undefined && t.order > max ? t.order : max), -1);

                await addDoc(tasksCollection, {
                    title: title,
                    assignee: assignee,
                    priority: priority,
                    completed: false,
                    order: maxOrder + 1,
                    createdAt: new Date()
                });
                document.getElementById('task-title').value = '';
            } catch (error) {
                console.error("שגיאה בהוספת משימה: ", error);
                alert("אירעה שגיאה בשמירת המשימה.");
            }
        });

        // שמירת שינויים מטופס העריכה (בפופאפ)
        document.getElementById('edit-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('edit-task-id').value;
            const title = document.getElementById('edit-task-title').value;
            const assignee = document.getElementById('edit-task-assignee').value;
            const priority = document.getElementById('edit-task-priority').value;

            try {
                const taskRef = doc(db, "tasks", id);
                await updateDoc(taskRef, {
                    title: title,
                    assignee: assignee,
                    priority: priority
                });
                closeEditModal();
            } catch (error) {
                console.error("שגיאה בעדכון משימה: ", error);
                alert("אירעה שגיאה בעדכון המשימה.");
            }
        });

        // האזנה לשינויים בזמן אמת מהענן
        const q = query(tasksCollection);
        onSnapshot(q, (snapshot) => {
            allTasks = [];
            snapshot.forEach((docSnapshot) => {
                allTasks.push({ id: docSnapshot.id, ...docSnapshot.data() });
            });
            // מיון לפי שדה ה-order (אם קיים, אחרת לפי הזמן)
            allTasks.sort((a, b) => (a.order || 0) - (b.order || 0));
            renderTasks();
        });

        // האזנה לשינויים בתיבות הסינון
        document.getElementById('filter-active').addEventListener('change', renderTasks);
        document.getElementById('filter-completed').addEventListener('change', renderTasks);

        function renderTasks() {
            const activeList = document.getElementById('active-tasks-list');
            const completedList = document.getElementById('completed-tasks-list');
            
            const activeFilter = document.getElementById('filter-active').value;
            const completedFilter = document.getElementById('filter-completed').value;

            activeList.innerHTML = '';
            completedList.innerHTML = '';

            let hasActive = false;
            let hasCompleted = false;

            const siteUrl = window.location.href;

            allTasks.forEach(task => {
                const matchesFilter = (filterVal, taskAssignee) => {
                    if (filterVal === 'הכל') return true;
                    if (taskAssignee === 'שנינו') return true;
                    return taskAssignee === filterVal;
                };

                const matchesActiveFilter = matchesFilter(activeFilter, task.assignee);
                const matchesCompletedFilter = matchesFilter(completedFilter, task.assignee);

                if (task.completed && !matchesCompletedFilter) return;
                if (!task.completed && !matchesActiveFilter) return;

                const taskCard = document.createElement('div');
                taskCard.className = `flex items-center justify-between p-4 border rounded-xl transition-all cursor-grab active:cursor-grabbing ${task.completed ? 'bg-gray-50 border-gray-200 opacity-70' : 'bg-white border-gray-200 shadow-sm'}`;
                taskCard.setAttribute('draggable', 'true');
                taskCard.dataset.id = task.id;
                
                const whatsappText = encodeURIComponent(`מקפיץ לך את המשימה ${task.title}\nקישור לאתר: ${siteUrl}`);
                const whatsappUrl = `https://wa.me/972504244336?text=${whatsappText}`;

                // אייקון וואצאפ רשמי SVG נקי
                const whatsappIconSvg = `<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>`;

                taskCard.innerHTML = `
                    <div class="flex items-center gap-3 flex-grow">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask('${task.id}', ${!task.completed})" class="w-5 h-5 text-blue-600 rounded cursor-pointer">
                        <div class="flex-grow">
                            <p class="font-medium ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</p>
                            <span class="text-xs text-gray-500">אחראי: ${task.assignee} | עדיפות: ${task.priority}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 sm:gap-2">
                        <a href="${whatsappUrl}" target="_blank" class="text-green-600 hover:text-green-700 bg-green-50 hover:bg-green-100 p-2 rounded-lg text-xs font-medium transition-colors flex items-center justify-center" title="שלח וואצאפ">
                            ${whatsappIconSvg}
                        </a>
                        <button onclick="openEditModal('${task.id}', '${escapeHtml(task.title)}', '${task.assignee}', '${task.priority}')" class="text-blue-500 hover:text-blue-700 text-sm font-medium px-2 py-1">ערוך</button>
                        <button onclick="deleteTask('${task.id}')" class="text-red-400 hover:text-red-600 text-sm font-medium px-2 py-1">מחק</button>
                    </div>
                `;

                // הוספת אירועי גרירה ושחרור (Drag and Drop)
                addDragAndDropEvents(taskCard);

                if (task.completed) {
                    hasCompleted = true;
                    completedList.appendChild(taskCard);
                } else {
                    hasActive = true;
                    activeList.appendChild(taskCard);
                }
            });

            if (!hasActive) {
                activeList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות תואמות להצגה</div>';
            }
            if (!hasCompleted) {
                completedList.innerHTML = '<div class="text-center py-4 text-gray-400">אין משימות תואמות להצגה</div>';
            }
        }

        // ניהול לוגיקת גרירה ושחרור
        function addDragAndDropEvents(element) {
            element.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', element.dataset.id);
                element.classList.add('dragging');
            });

            element.addEventListener('dragend', () => {
                element.classList.remove('dragging');
                document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            });

            element.addEventListener('dragover', (e) => {
                e.preventDefault();
                const draggingElement = document.querySelector('.dragging');
                if (!draggingElement) return;

                const parentList = element.parentNode;
                const draggingParent = draggingElement.parentNode;

                // אפשר לגרור רק בתוך אותו בלוק (לביצוע / בוצעו)
                if (parentList === draggingParent) {
                    element.classList.add('drag-over');
                    const bounding = element.getBoundingClientRect();
                    const offset = e.clientY - bounding.top;
                    const middle = bounding.height / 2;

                    if (offset > middle) {
                        parentList.insertBefore(draggingElement, element.nextSibling);
                    } else {
                        parentList.insertBefore(draggingElement, element);
                    }
                }
            });

            element.addEventListener('dragleave', () => {
                element.classList.remove('drag-over');
            });

            element.addEventListener('drop', async (e) => {
                e.preventDefault();
                element.classList.remove('drag-over');

                // שמירת הסדר החדש בענן לאחר הגרירה
                const parentList = element.parentNode;
                const taskCards = parentList.querySelectorAll('[data-id]');
                
                const batch = writeBatch(db);
                taskCards.forEach((card, index) => {
                    const taskId = card.dataset.id;
                    const taskRef = doc(db, "tasks", taskId);
                    batch.update(taskRef, { order: index });
                });

                try {
                    await batch.commit();
                } catch (error) {
                    console.error("שגיאה בעדכון סדר המשימות: ", error);
                }
            });
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }

        // ניהול פופאפ עריכה
        window.openEditModal = function(id, title, assignee, priority) {
            document.getElementById('edit-task-id').value = id;
            document.getElementById('edit-task-title').value = title;
            document.getElementById('edit-task-assignee').value = assignee;
            document.getElementById('edit-task-priority').value = priority;
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        window.closeEditModal = function() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        window.toggleTask = async function(id, completed) {
            const taskRef = doc(db, "tasks", id);
            await updateDoc(taskRef, { completed: completed });
        }

        window.deleteTask = async function(id) {
            if (confirm("האם למחוק את המשימה לצמיתות?")) {
                const taskRef = doc(db, "tasks", id);
                await deleteDoc(taskRef);
            }
        }
    </script>
</body>
</html>
